<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>YLCT</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 380px; padding: 0; margin: 0; }
    .tabs {
      display: flex; border-bottom: 1px solid #ddd; background: #f5f5f5;
    }
    .tab {
      flex: 1; padding: 10px; cursor: pointer; text-align: center;
      font-size: 13px; border: none; background: transparent;
      border-bottom: 2px solid transparent;
    }
    .tab.active { background: #fff; border-bottom-color: #1976d2; font-weight: 600; }
    .tab:hover:not(.active) { background: #ececec; }

    .pane { padding: 12px; display: none; }
    .pane.active { display: block; }

    h2 { font-size: 12px; margin: 12px 0 6px; color: #666; font-weight: 600;
         text-transform: uppercase; letter-spacing: 0.04em; }
    h2:first-child { margin-top: 0; }

    button { display: block; width: 100%; padding: 8px; margin: 4px 0; cursor: pointer;
             font-size: 13px; border: 1px solid #ccc; background: #f7f7f7; border-radius: 4px; }
    button:hover { background: #ececec; }
    button:disabled { opacity: 0.5; cursor: wait; }
    button.primary { background: #1976d2; color: #fff; border-color: #1976d2; }
    button.primary:hover:not(:disabled) { background: #1565c0; }

    input { width: 100%; padding: 6px; box-sizing: border-box; font-size: 13px;
            border: 1px solid #ccc; border-radius: 4px; }
    label { font-size: 12px; color: #666; display: block; margin-top: 8px; }
    pre { background: #1e1e1e; color: #e6e6e6; padding: 8px; border-radius: 4px;
          font-size: 11px; max-height: 220px; overflow: auto; white-space: pre-wrap;
          word-break: break-word; margin: 8px 0 0; }

    .channel-card {
      background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px;
      padding: 10px; margin-bottom: 8px;
    }
    .channel-card .name { font-size: 13px; font-weight: 600; color: #222; }
    .channel-card .id { font-size: 10px; color: #999; margin-top: 2px;
                        font-family: monospace; word-break: break-all; }

    ul.whitelist { list-style: none; padding: 0; margin: 0; }
    ul.whitelist li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px; border-bottom: 1px solid #eee; font-size: 12px; gap: 6px;
    }
    ul.whitelist li:last-child { border-bottom: none; }
    ul.whitelist li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    ul.whitelist li button {
      width: auto; padding: 3px 8px; margin: 0; font-size: 11px;
    }
    .whitelist-empty { color: #999; font-size: 12px; padding: 8px; font-style: italic; }

    .info-banner {
      background: #fff3e0; border-left: 3px solid #ff9800;
      padding: 8px; margin: 8px 0; font-size: 11px; color: #444;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" id="tab-main">메인</button>
    <button class="tab" id="tab-debug">디버그</button>
  </div>

  <div class="pane active" id="pane-main">
    <h2>현재 채널</h2>
    <div class="channel-card" id="current-channel-card">
      <div class="name" id="current-channel-name">불러오는 중...</div>
      <div class="id" id="current-channel-id"></div>
    </div>
    <button class="primary" id="add-channel-btn" disabled>이 채널을 화이트리스트에 추가</button>

    <h2>화이트리스트</h2>
    <div class="info-banner" id="whitelist-info">
      비어있으면 번역이 비활성화됩니다. 추가한 채널에서만 동작합니다.
    </div>
    <ul class="whitelist" id="whitelist-list"></ul>

    <h2>옵션</h2>
    <label for="batch-window">번역 대기 시간 (배치 윈도우):</label>
    <select id="batch-window" style="width:100%; padding:6px; font-size:13px; margin-top:4px;">
      <option value="5000">5초 (가장 빠름, Max 한도 부담)</option>
      <option value="10000">10초</option>
      <option value="15000">15초 (기본)</option>
      <option value="20000">20초</option>
      <option value="30000">30초 (Max 한도 절약)</option>
      <option value="60000">60초 (가장 절약)</option>
    </select>

    <label for="max-turns" style="margin-top:10px;">세션 자동 재시작 (컨텍스트 누적 방지):</label>
    <select id="max-turns" style="width:100%; padding:6px; font-size:13px; margin-top:4px;">
      <option value="100">100 turn (~1.5시간)</option>
      <option value="200">200 turn (~3시간, 기본)</option>
      <option value="500">500 turn (~8시간)</option>
      <option value="0">사용 안 함</option>
    </select>

    <button id="reset-session-btn" style="margin-top:8px;">세션 즉시 재시작</button>
  </div>

  <div class="pane" id="pane-debug">
    <h2>Native Host 점검</h2>
    <button id="ping-btn">1. Ping host (sanity check)</button>

    <label for="prompt-input">Prompt for claude -p:</label>
    <input id="prompt-input" type="text"
           value="다음 일본어를 한국어로 번역만 해줘. 다른 말 없이 번역문만 출력. 입력: やばい今のプレイ神！" />
    <button id="claude-btn">2. Call claude -p</button>

    <pre id="output">[idle]</pre>
  </div>

  <script src="../shared/constants.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
