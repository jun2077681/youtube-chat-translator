<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0E9"/>
      <stop offset="1" stop-color="#D7C4F0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- live indicator (top-left, single bright dot survives at 16px) -->
  <circle cx="20" cy="20" r="6.5" fill="#FF3D60"/>
  <circle cx="20" cy="20" r="2.2" fill="#fff" opacity="0.65"/>

  <!-- chat bubble -->
  <g filter="url(#sh)">
    <rect x="14" y="38" width="100" height="72" rx="20" fill="#FFFFFF" fill-opacity="0.94"/>
    <path d="M 32 108 L 26 122 L 48 108 Z" fill="#FFFFFF" fill-opacity="0.94"/>
  </g>

  <!-- あ / 가 inside bubble -->
  <text x="44" y="92"
    font-family="'Yu Gothic UI','Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif"
    font-size="48" font-weight="700" text-anchor="middle"
    fill="#5A2D82">あ</text>
  <text x="84" y="92"
    font-family="'Noto Sans KR','Malgun Gothic',sans-serif"
    font-size="48" font-weight="700" text-anchor="middle"
    fill="#C73E91">가</text>

  <!-- subtle divider -->
  <line x1="64" y1="54" x2="64" y2="100" stroke="#5A2D82" stroke-width="1.4" opacity="0.30"/>
</svg>
